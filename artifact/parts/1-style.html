<title>Sorbonne Copilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sổ tay tối giản — một cột đọc 680px, thẻ phẳng viền mảnh, thanh tab nổi; Học và Ôn tập mở toàn màn hình như chế độ đọc */
:root {
  --bg: #f6f6f9;
  --surface: #ffffff;
  --surface-2: #f0eff5;
  --ink: #1e1c28;
  --ink-2: #5f5c70;
  --ink-3: #8e8ba1;
  --line: #e7e6ef;
  --accent: #6656e8;
  --accent-ink: #ffffff;
  --accent-soft: #eeecfd;
  --blush: #ff9fb0;
  --res-body: #eadcc2;
  --danger: #d4473b; --danger-ink: #ffffff;
  --exam-bg: #ffe9e7; --exam-fg: #c0392f;
  --due-bg: #fff3d4; --due-fg: #8f6200;
  --close-bg: #ffeadc; --close-fg: #ad531a;
  --hol-bg: #e1f5ea; --hol-fg: #1f7a50;
  --evt-bg: #e7efff; --evt-fg: #2f5fc0;
  --shadow-soft: 0 1px 2px rgba(30, 24, 60, .04), 0 4px 14px rgba(30, 24, 60, .05);
  --shadow-float: 0 1px 2px rgba(30, 24, 60, .06), 0 12px 34px rgba(30, 24, 60, .12);
  --font: "Nunito", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-s: 10px; --r-m: 16px; --r-l: 22px;
  --tabbar-h: 66px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141319; --surface: #1c1b23; --surface-2: #25242e; --ink: #ecebf3; --ink-2: #aeabbf; --ink-3: #7d7a92; --line: #2f2e3a;
  --accent: #a99cff; --accent-ink: #141319; --accent-soft: #2a2645; --blush: #ff8aa0; --res-body: #5a5142;
  --danger: #ff8f86; --danger-ink: #1b1219;
  --exam-bg: #3a2120; --exam-fg: #ff9c94; --due-bg: #33290f; --due-fg: #f2c45a; --close-bg: #36241a; --close-fg: #ffb27d;
  --hol-bg: #15301f; --hol-fg: #74d6a4; --evt-bg: #1b2840; --evt-fg: #8fb4ff;
  --shadow-soft: 0 1px 2px rgba(0, 0, 0, .3); --shadow-float: 0 12px 34px rgba(0, 0, 0, .45);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141319; --surface: #1c1b23; --surface-2: #25242e; --ink: #ecebf3; --ink-2: #aeabbf; --ink-3: #7d7a92; --line: #2f2e3a;
  --accent: #a99cff; --accent-ink: #141319; --accent-soft: #2a2645; --blush: #ff8aa0; --res-body: #5a5142;
  --danger: #ff8f86; --danger-ink: #1b1219;
  --exam-bg: #3a2120; --exam-fg: #ff9c94; --due-bg: #33290f; --due-fg: #f2c45a; --close-bg: #36241a; --close-fg: #ffb27d;
  --hol-bg: #15301f; --hol-fg: #74d6a4; --evt-bg: #1b2840; --evt-fg: #8fb4ff;
  --shadow-soft: 0 1px 2px rgba(0, 0, 0, .3); --shadow-float: 0 12px 34px rgba(0, 0, 0, .45);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.err { color: var(--danger); font-weight: 700; font-size: 14px; }
.label { font: 800 11px/1.2 var(--font); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(var(--tabbar-h) + 44px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 14px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.notice { background: var(--due-bg); color: var(--ink); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }

/* tiêu đề */
.hello { display: flex; align-items: center; gap: 12px; padding-block: 4px 2px; }
.hello h1 { font: 800 25px/1.15 var(--font); letter-spacing: -.02em; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-block: 4px 2px; }
.page-h h1 { font: 800 28px/1.1 var(--font); letter-spacing: -.02em; }
.page-h p { margin-top: 4px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.link { border: 0; background: none; color: var(--accent); font: 800 13px var(--font); cursor: pointer; padding: 4px 2px; }

/* linh vật: electron nhỏ */
.mascot { width: 48px; height: 48px; flex: none; overflow: visible; }
.mascot.sm { width: 38px; height: 38px; } .mascot.lg { width: 84px; height: 84px; } .mascot.xs { width: 20px; height: 20px; }
.m-orbit { fill: none; stroke: var(--accent); stroke-width: 1.6; opacity: .45; }
.m-e { fill: var(--accent); }
.m-body { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.m-eye { fill: var(--ink); }
.m-smile { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; }
.m-blush { fill: var(--blush); opacity: .75; }

/* nút */
.btn { font: 800 14px/1.1 var(--font); border-radius: 12px; padding: 11px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; gap: 7px; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; transition: transform .08s ease, background .15s ease; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.danger { background: var(--danger); color: var(--danger-ink); border-color: transparent; }
.btn.sm { padding: 8px 11px; font-size: 13px; border-radius: 10px; }
.btn.lg { padding: 14px 16px; font-size: 15px; border-radius: 14px; }
.btn.block { width: 100%; }
.i { width: 20px; height: 20px; flex: none; }
.i.xs { width: 14px; height: 14px; vertical-align: -2px; }
.btn .i { width: 18px; height: 18px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.solid { background: var(--accent); color: var(--accent-ink); border-radius: 14px; width: 44px; height: 44px; }
.typing { display: inline-flex; gap: 4px; align-items: center; color: var(--ink-3); font-size: 13.5px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: bob 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.typing span { margin-left: 6px; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-4px); opacity: 1; } }

/* thẻ */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.empty { text-align: center; display: grid; justify-items: center; gap: 10px; padding: 26px 18px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-l); }
.empty h3 { font: 800 17px var(--font); }
.empty p { color: var(--ink-2); max-width: 38ch; font-size: 14px; }
.empty.flat { padding: 16px; } .empty.flat p { font-size: 13.5px; }

/* tình hình campus */
.st-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.st-verdict { display: flex; align-items: center; gap: 12px; font-size: 19px; line-height: 1.25; }
.st-verdict strong { font-weight: 800; letter-spacing: -.01em; }
.st-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--dot); box-shadow: 0 0 0 5px var(--dot-ring); margin-left: 4px; }
.v-go { --dot: var(--evt-fg); --dot-ring: var(--evt-bg); }
.v-stay { --dot: var(--hol-fg); --dot-ring: var(--hol-bg); }
.v-partial { --dot: var(--due-fg); --dot-ring: var(--due-bg); }
.v-unknown { --dot: var(--ink-3); --dot-ring: var(--surface-2); }
.st-points { margin: 0; padding-left: 18px; display: grid; gap: 3px; color: var(--ink-2); font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font-size: 12px; line-height: 1.35; color: var(--ink-2); min-width: 0; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font: 800 11px var(--font); margin-bottom: 4px; }
.steps b { color: var(--ink); font-weight: 800; }

/* mail */
.mini-mails { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.mini-mails li { display: flex; gap: 10px; min-width: 0; }
.mini-mails li > div { min-width: 0; }
.mini-mails strong { display: block; font-weight: 800; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-mails p { color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.imp { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ink-3); }
.imp-haute { background: var(--exam-fg); } .imp-moyenne { background: var(--due-fg); }
.mail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.mail-top { display: flex; gap: 8px; align-items: baseline; }
.mail-top strong { flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere; }
.mail-top .imp { margin-top: 0; align-self: center; }
.todo { display: flex; gap: 6px; font-weight: 700; font-size: 14px; color: var(--ink); }
.todo .i { width: 16px; height: 16px; margin-top: 2px; color: var(--accent); }
.nudge { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid transparent; background: var(--accent-soft); border-radius: var(--r-l); padding: 12px 14px; cursor: pointer; color: var(--ink); }
.nudge > span:nth-child(2) { flex: 1; display: grid; min-width: 0; }
.nudge strong { font-weight: 800; }

/* lịch */
.list { display: grid; gap: 8px; }
.ev { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; transition: box-shadow .3s; }
.ev[data-go] { cursor: pointer; grid-template-columns: 52px minmax(0, 1fr); }
.ev.flash { box-shadow: 0 0 0 2px var(--accent); }
.ev.done { opacity: .5; } .ev.done h4 { text-decoration: line-through; }
.ev-date { display: grid; justify-items: center; background: var(--ev-bg); color: var(--ev-fg); border-radius: 12px; padding: 7px 0 6px; }
.ev-date .dn { font: 800 20px/1 var(--font); font-variant-numeric: tabular-nums; }
.ev-date .wd { font: 800 10px/1.3 var(--font); margin-top: 3px; opacity: .85; white-space: nowrap; }
.ev-body { min-width: 0; display: grid; gap: 3px; }
.ev-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ev h4 { font: 800 15px/1.3 var(--font); overflow-wrap: anywhere; }
.ev .meta { font-size: 13px; color: var(--ink-2); }
.ev .det { font-size: 13px; color: var(--ink-2); }
.ev .det b { color: var(--ink); font-weight: 800; margin-right: 6px; }
.ev .icon-btn { width: 34px; height: 34px; margin: -4px -4px 0 0; }
.count { font: 800 11.5px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--ink-3); }
.count.urgent { color: var(--exam-fg); }
.c-exam { --ev-bg: var(--exam-bg); --ev-fg: var(--exam-fg); }
.c-deadline { --ev-bg: var(--due-bg); --ev-fg: var(--due-fg); }
.c-closure { --ev-bg: var(--close-bg); --ev-fg: var(--close-fg); }
.c-holiday { --ev-bg: var(--hol-bg); --ev-fg: var(--hol-fg); }
.c-event { --ev-bg: var(--evt-bg); --ev-fg: var(--evt-fg); }
.tag { font: 800 11px/1 var(--font); padding: 4px 8px; border-radius: 999px; background: var(--ev-bg, var(--surface-2)); color: var(--ev-fg, var(--ink-2)); white-space: nowrap; }
.group-h { margin: 8px 2px 0; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 46px; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 3px; cursor: pointer; color: var(--ink); }
.day .wd { font: 800 10px var(--font); color: var(--ink-3); }
.day .dn { font: 800 16px/1 var(--font); font-variant-numeric: tabular-nums; }
.day .dots { display: flex; gap: 2px; height: 5px; }
.day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ev-fg); }
.day.today { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day.today .wd { color: inherit; opacity: .85; }
.day.today .dots i { background: var(--accent-ink); }

/* học */
.course-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; cursor: pointer; color: var(--ink); }
.course-card:active { transform: scale(.99); }
.cc-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.cc-title { font: 800 15.5px/1.3 var(--font); overflow-wrap: anywhere; }
.cc-meta { font-size: 12.5px; color: var(--ink-3); }
.cc-exam { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; flex: none; position: relative; }
.res::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; margin-top: -1px; background: var(--ink-3); opacity: .55; border-radius: 2px; }
.res i { position: relative; width: 24px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, transparent 5px, var(--b1) 5px 8px, transparent 8px 11px, var(--b2) 11px 14px, transparent 14px 17px, var(--b3) 17px 20px, transparent 20px), var(--res-body); }
.fr-glyph { width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 800 15px var(--font); flex: none; }
.deck-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; }
.deck-row > div { flex: 1; min-width: 0; display: grid; }
.deck-row strong { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* màn toàn màn hình (học, ôn) */
.immersive { min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; }
.bar-in { max-width: 720px; margin: 0 auto; width: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.topbar .bar-in { display: flex; align-items: center; gap: 6px; padding-block: 8px; }
.tb-title { flex: 1; min-width: 0; display: grid; }
.tb-title strong { font: 800 15.5px/1.25 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { border: 0; background: none; padding: 0; text-align: left; color: var(--ink-3); font: 700 12px var(--font); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; justify-self: start; }
.tb-sub .i { width: 13px; height: 13px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; font: 800 12px/1 var(--font); padding: 7px 9px; border-radius: 8px; color: var(--ink-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.thread-wrap { flex: 1; }
.thread { display: flex; flex-direction: column; gap: 20px; padding-block: 20px 14px; }
.msg { min-width: 0; }
.msg.a .who { display: flex; align-items: center; gap: 6px; font: 800 12px/1 var(--font); color: var(--ink-3); margin-bottom: 8px; }
.msg.a .md { font-size: 16px; line-height: 1.68; }
.msg.u { align-self: flex-end; max-width: 86%; display: grid; justify-items: end; gap: 6px; }
.msg.u .bubble { background: var(--accent-soft); color: var(--ink); padding: 10px 14px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; }
.msg.u .mode { display: inline-flex; gap: 4px; align-items: center; font: 800 11.5px var(--font); color: var(--accent); }
.msg.u .mode .i { width: 14px; height: 14px; }
.fix { background: var(--due-bg); border-radius: 14px; padding: 8px 12px; font-size: 14px; max-width: 100%; }
.fix summary { cursor: pointer; font-weight: 800; color: var(--due-fg); list-style: none; display: flex; gap: 6px; align-items: center; }
.fix summary::-webkit-details-marker { display: none; }
.fix summary .i { width: 15px; height: 15px; }
.fix ul { margin: 8px 0 4px; padding: 0; list-style: none; display: grid; gap: 10px; }
.fix li { display: grid; gap: 2px; }
.fix s { color: var(--exam-fg); }
.fix .vi, .fix .tip { color: var(--ink-2); } .fix .tip { font-style: italic; }
.starter { display: grid; justify-items: center; text-align: center; gap: 8px; padding-block: 24px 8px; }
.starter h2 { font: 800 20px/1.25 var(--font); }
.starter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 10px; }
.starter-grid button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 12px; cursor: pointer; display: grid; gap: 3px; color: var(--ink); }
.starter-grid strong { font-weight: 800; font-size: 14px; }
.starter-grid span { font-size: 12.5px; color: var(--ink-2); }
.composer { position: sticky; bottom: 0; z-index: 20; background: linear-gradient(to top, var(--bg) 80%, transparent); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer .bar-in { display: grid; gap: 8px; padding-top: 12px; }
.suggest { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.suggest::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font: 700 13px var(--font); color: var(--ink-2); cursor: pointer; }
.mode-banner { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 6px 6px 6px 12px; font: 700 13px/1.35 var(--font); }
.mode-banner span { flex: 1; }
.mode-banner .icon-btn { width: 30px; height: 30px; color: var(--accent); }
