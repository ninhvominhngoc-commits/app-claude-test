<title>Sorbonne Copilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: nền tối sương xanh thép, thẻ kính mờ, nút viên bóng sáng, đồng hồ LCD; Hôm nay mở đầu bằng việc nên làm ngay, nút Tập trung và 3 mục tiêu ngày; Học, Ôn, Tập trung là màn toàn màn hình */
:root {
  --bg: #fbf3e4;
  --grid: rgba(120, 80, 50, .07);
  --surface: #fffaf1;
  --surface-2: #f6ead6;
  --ink: #4a3428;
  --ink-2: #6a5042;
  --ink-3: #7d6253;
  --line: #ead9bf;
  --outline: #6b4a3a;
  --chunk: #e2cba6;            /* bóng đáy của nút/thẻ kem */
  --accent: #52701a;           /* chữ, link, biểu tượng màu matcha */
  --accent-btn: #bcd76b;       /* nền nút chính */
  --accent-chunk: #8ba446;     /* bóng đáy nút chính */
  --accent-ink: #3a2a20;       /* chữ trên nút chính */
  --accent-soft: #eaf2cf;
  --chart: #6f9530;
  --hl: rgba(255, 205, 80, .5);
  --blush: #ff9fb0;
  --res-body: #ecdfc6;
  --danger: #c6402f; --danger-ink: #ffffff; --danger-chunk: #8f2a1d;
  --t-lav: #ebe5fb; --k-lav: #5440b5;
  --t-peach: #ffe2c9; --k-peach: #9a4416;
  --t-mint: #d8f0de; --k-mint: #1f6b44;
  --t-sky: #d9ecf7; --k-sky: #22598a;
  --t-butter: #ffeaa8; --k-butter: #6e4e00;
  --t-rose: #ffdde5; --k-rose: #a02a52;
  --sky-1: #cfe8f6; --sky-2: #eef6e2; --sky-ink: #4a3428; --sky-ink-2: #5d4639; --cloud: #ffffff;
  --shadow-card: 0 4px 0 var(--chunk);
  --shadow-float: 0 3px 0 var(--chunk), 0 18px 36px -18px rgba(90, 60, 30, .45);
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --r-m: 18px; --r-l: 24px;
  --tabbar-h: 68px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #221a16; --grid: rgba(255, 230, 200, .05); --surface: #2e2420; --surface-2: #3a2e28; --ink: #f6ead8; --ink-2: #e0cfb9; --ink-3: #bba691; --line: #4a3b33;
  --outline: #120c09; --chunk: #160f0c; --accent: #c9e27f; --accent-btn: #b4cf62; --accent-chunk: #5f7426; --accent-ink: #241a13; --accent-soft: #38411f;
  --chart: #82a33f; --hl: rgba(255, 205, 80, .26); --blush: #ff8aa0; --res-body: #5c5343;
  --danger: #ff8f80; --danger-ink: #241713; --danger-chunk: #7a2b20;
  --t-lav: #332b4d; --k-lav: #cdc2ff; --t-peach: #4a3022; --k-peach: #ffc29a; --t-mint: #1f3a2b; --k-mint: #a3e3b9;
  --t-sky: #1e3345; --k-sky: #abd4f2; --t-butter: #463a1c; --k-butter: #f6d27a; --t-rose: #47262f; --k-rose: #ffb3c4;
  --sky-1: #1b2742; --sky-2: #2c2236; --sky-ink: #f6ead8; --sky-ink-2: #d9c9e8; --cloud: #3b3552;
  --shadow-card: 0 4px 0 var(--chunk); --shadow-float: 0 3px 0 var(--chunk), 0 18px 36px -14px rgba(0, 0, 0, .7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #221a16; --grid: rgba(255, 230, 200, .05); --surface: #2e2420; --surface-2: #3a2e28; --ink: #f6ead8; --ink-2: #e0cfb9; --ink-3: #bba691; --line: #4a3b33;
  --outline: #120c09; --chunk: #160f0c; --accent: #c9e27f; --accent-btn: #b4cf62; --accent-chunk: #5f7426; --accent-ink: #241a13; --accent-soft: #38411f;
  --chart: #82a33f; --hl: rgba(255, 205, 80, .26); --blush: #ff8aa0; --res-body: #5c5343;
  --danger: #ff8f80; --danger-ink: #241713; --danger-chunk: #7a2b20;
  --t-lav: #332b4d; --k-lav: #cdc2ff; --t-peach: #4a3022; --k-peach: #ffc29a; --t-mint: #1f3a2b; --k-mint: #a3e3b9;
  --t-sky: #1e3345; --k-sky: #abd4f2; --t-butter: #463a1c; --k-butter: #f6d27a; --t-rose: #47262f; --k-rose: #ffb3c4;
  --sky-1: #1b2742; --sky-2: #2c2236; --sky-ink: #f6ead8; --sky-ink-2: #d9c9e8; --cloud: #3b3552;
  --shadow-card: 0 4px 0 var(--chunk); --shadow-float: 0 3px 0 var(--chunk), 0 18px 36px -14px rgba(0, 0, 0, .7);
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 600 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  background-color: var(--bg); background-image: radial-gradient(var(--grid) 1.2px, transparent 1.5px); background-size: 24px 24px; background-position: 12px 12px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
body.noscroll { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.display { font-family: var(--display); font-weight: 800; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 13px; }
.center { text-align: center; }
.err { color: var(--danger); font-weight: 800; font-size: 14px; }
.label { font: 800 12px/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.eyebrow { font: 800 12.5px/1.2 var(--font); color: var(--ink-3); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(var(--tabbar-h) + 46px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 16px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.notice { background: var(--t-butter); color: var(--ink); border: 1px solid var(--outline); border-radius: 16px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }

/* tiêu đề trang: nhãn tròn kiểu dán */
.hello { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hello-txt { display: grid; gap: 2px; min-width: 0; }
.hello h1 { font: 800 28px/1.1 var(--display); }
.hello h1 em { font-style: normal; color: var(--accent); }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 2px; }
.page-h h1 { display: inline-block; font: 800 26px/1.15 var(--display); background: var(--accent-btn); color: var(--accent-ink); border: 1px solid var(--outline); border-radius: 999px; padding: 4px 18px 2px; box-shadow: 0 4px 0 var(--accent-chunk); }
.page-h p { margin-top: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.link { border: 0; background: none; color: var(--accent); font: 800 13.5px var(--font); cursor: pointer; padding: 4px 2px; }

/* linh vật: bé electron viền mực */
.mascot { width: 48px; height: 48px; flex: none; overflow: visible; }
.mascot.sm { width: 40px; height: 40px; } .mascot.md { width: 64px; height: 64px; } .mascot.lg { width: 96px; height: 96px; } .mascot.xl { width: 128px; height: 128px; } .mascot.xs { width: 20px; height: 20px; }
.m-orbit { fill: none; stroke: var(--outline); stroke-width: 1.6; stroke-dasharray: 3 3; opacity: .55; }
.m-e { fill: var(--k-peach); stroke: var(--outline); stroke-width: 1.2; }
.m-body { fill: #ffe9b8; stroke: var(--outline); stroke-width: 2.2; }
.m-eye { fill: #3a2a20; transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.m-line { fill: none; stroke: #3a2a20; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.m-mouth { fill: #3a2a20; }
.m-blush { fill: var(--blush); opacity: .8; }
.m-spark { fill: var(--k-butter); }
.m-z { fill: var(--ink-3); font: 800 9px var(--font); }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

/* nút "dày" có bóng đáy */
.btn { font: 800 14.5px/1.1 var(--font); border-radius: 16px; padding: 11px 16px; border: 1px solid var(--outline); background: var(--surface); color: var(--ink); display: inline-flex; gap: 7px; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; box-shadow: 0 4px 0 var(--chunk); transition: transform .08s ease, box-shadow .08s ease; position: relative; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--chunk); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent-btn); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-chunk); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-chunk); }
.btn.soft { background: var(--accent-soft); color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); box-shadow: none; }
.btn.glass { background: var(--surface); }
.btn.danger { background: var(--danger); color: var(--danger-ink); box-shadow: 0 4px 0 var(--danger-chunk); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 13px; box-shadow: 0 3px 0 var(--chunk); }
.btn.primary.sm { box-shadow: 0 3px 0 var(--accent-chunk); }
.btn.ghost.sm { box-shadow: none; }
.btn.lg { padding: 14px 20px; font-size: 16px; border-radius: 20px; }
.btn.block { width: 100%; }
.i { width: 20px; height: 20px; flex: none; }
.i.xs { width: 14px; height: 14px; vertical-align: -2px; }
.btn .i { width: 18px; height: 18px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: pointer; flex: none; transition: transform .1s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.solid { background: var(--accent-btn); color: var(--accent-ink); border: 1px solid var(--outline); border-radius: 16px; width: 48px; height: 48px; box-shadow: 0 4px 0 var(--accent-chunk); }
.icon-btn.solid:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-chunk); }
.badge-ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--tint, var(--accent-soft)); color: var(--tk, var(--accent)); border: 1px solid var(--outline); flex: none; }
.badge-ic .i { width: 18px; height: 18px; }
.typing { display: inline-flex; gap: 4px; align-items: center; color: var(--ink-3); font-size: 13.5px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .6; animation: bob 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.typing span { margin-left: 6px; }
@keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: 1; } }

/* thẻ (tile) có viền mực và đường chỉ khâu */
.tile, .card { position: relative; background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-l); padding: 16px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow-card); }
.tile.tinted { background: var(--tint); }
.tile.tinted::after { content: ""; position: absolute; inset: 6px; border: 1.5px dashed color-mix(in srgb, var(--outline) 30%, transparent); border-radius: 18px; pointer-events: none; }
.tile-head { display: flex; align-items: center; gap: 10px; }
.tile-head > div { flex: 1; min-width: 0; display: grid; gap: 1px; }
.empty { text-align: center; display: grid; justify-items: center; gap: 10px; padding: 26px 18px; background: var(--surface); border: 1px dashed var(--outline); border-radius: var(--r-l); }
.empty h3 { font: 800 19px/1.2 var(--display); }
.empty p { color: var(--ink-2); max-width: 38ch; font-size: 14px; }
.empty.flat { padding: 16px; } .empty.flat p { font-size: 13.5px; }

/* ô tình hình campus */
.v-go { --tint: var(--t-sky); --tk: var(--k-sky); }
.v-stay { --tint: var(--t-mint); --tk: var(--k-mint); }
.v-partial { --tint: var(--t-butter); --tk: var(--k-butter); }
.v-unknown { --tint: var(--t-lav); --tk: var(--k-lav); }
.verdict { font: 800 23px/1.15 var(--display); color: var(--ink); }
.verdict-sub { color: var(--ink-2); font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { background: var(--surface); border: 1px solid var(--outline); border-radius: 999px; padding: 5px 11px; font: 700 12.5px/1.25 var(--font); color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--outline); border-radius: 14px; padding: 9px 10px; font-size: 12px; line-height: 1.35; color: var(--ink-2); min-width: 0; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-btn); color: var(--accent-ink); border: 1px solid var(--outline); font: 800 11px var(--font); margin-bottom: 5px; }
.steps b { color: var(--ink); font-weight: 800; }
